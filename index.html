<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品活动价格公式表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }
        .container {
            width: 80%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 0;
            box-sizing: border-box;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }
        .title {
            text-align: center;
            padding: 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px 10px 0 0;
            margin: 0;
        }
        /* 标签页样式 - 已优化背景色 */
        .tabs {
            display: flex;
            background-color: #f1f1f1; /* 明确设置标签栏背景色 */
            border-bottom: 1px solid #ccc;
        }
        .tab-button {
            background-color: #f1f1f1; /* 默认与父容器同色 */
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            flex-grow: 1;
        }
        .tab-button:hover {
            background-color: #e9e9e9;
        }
        .tab-button.active {
            background-color: #e8f5e9; /* 激活标签的淡绿色背景 */
            color: #4CAF50;
            font-weight: bolder;
            border-bottom: 3px solid #4CAF50;
        }
        .tab-content {
            display: none;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeEffect 0.5s;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeEffect {
            from {opacity: 0;}
</html>
